# Connectivity test #2: which data sources can a GitHub cloud runner reach?
# Run it by hand from the repository's Actions tab ("Run workflow"). It changes nothing.
name: Data source connectivity check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test each source (every check runs, even if an earlier one fails)
        run: |
          check() {  # name, url
            code=$(curl -s -o /tmp/body -w "%{http_code}" -m 20 \
              -H "User-Agent: Mozilla/5.0 (compatible; nba-prediction research)" "$2" || true)
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            if [ "$code" = "200" ]; then echo "OK    $1 (HTTP $code, $size bytes)"; else echo "FAIL  $1 (HTTP ${code:-timeout})"; fi
          }
          check "ESPN scoreboard"        "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261020"
          check "ESPN game box score"    "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401909088"
          check "NBA injury report PDF"  "https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-01-15_05_00PM.pdf"
          check "stats.nba.com (again)"  "https://stats.nba.com/stats/scheduleleaguev2?LeagueID=00&Season=2026-27"
