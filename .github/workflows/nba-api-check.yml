# Connectivity test: can a GitHub cloud runner reach every data source the live site needs?
# Run it by hand from the repository's Actions tab ("Run workflow"). It changes nothing.
name: NBA data connectivity check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nba_api
        run: pip install nba_api==1.11.4 requests

      - name: stats.nba.com via nba_api (results, players, schedule)
        run: |
          python - <<'EOF'
          import time
          from nba_api.stats.endpoints import leaguegamelog, scheduleleaguev2
          checks = {
              "team game logs 2026-27": lambda: leaguegamelog.LeagueGameLog(
                  season="2026-27", season_type_all_star="Regular Season",
                  player_or_team_abbreviation="T", timeout=60).get_data_frames()[0],
              "player game logs 2026-27": lambda: leaguegamelog.LeagueGameLog(
                  season="2026-27", season_type_all_star="Regular Season",
                  player_or_team_abbreviation="P", timeout=60).get_data_frames()[0],
              "schedule 2026-27": lambda: scheduleleaguev2.ScheduleLeagueV2(
                  league_id="00", season="2026-27", timeout=60).get_data_frames()[0],
          }
          failed = 0
          for name, fetch in checks.items():
              start = time.time()
              try:
                  rows = len(fetch())
                  print(f"OK    {name}: {rows} rows in {time.time() - start:.1f}s")
              except Exception as error:
                  failed += 1
                  print(f"FAIL  {name}: {type(error).__name__}: {str(error)[:200]} after {time.time() - start:.1f}s")
          raise SystemExit(failed)
          EOF

      - name: Official injury report (ak-static.cms.nba.com)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            "https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-01-15_05_00PM.pdf")
          echo "injury report HTTP $code"
          test "$code" = "200"
